name: Build Firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  TARGET: esp32s2

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    strategy:
      fail-fast: false
      matrix:
        project: [blink, env-station]
    steps:
      - uses: actions/checkout@v4

      - name: Build Firmware (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target $TARGET
          idf.py build

      - name: Prepare Artifacts
        working-directory: ${{ matrix.project }}
        run: |
          mkdir -p ../firmware
          cp build/bootloader/bootloader.bin ../firmware/${{ matrix.project }}_bootloader.bin
          cp build/partition_table/partition-table.bin ../firmware/${{ matrix.project }}_partition_table.bin
          APP_BIN=$(ls build/*.bin | grep -v -e bootloader -e partition -e ota_data | head -1)
          cp "$APP_BIN" ../firmware/${{ matrix.project }}_firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.project }}
          path: firmware/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware/

      # blink ships the OTA dual-slot layout: app offset 0x20000
      # ESP32-S2 bootloader offset is 0x1000 (inherited from classic ESP32,
      # unlike S3/C3 at 0x0 — verified against idf.py's own flash_args)
      - name: Create Flash Scripts
        run: |
          cat > flash_blink.sh << 'SCRIPT'
          #!/bin/bash
          # blink (Wemos S2 Mini / ESP32-S2) flash script
          # Enter download mode first: hold BOOT, tap RESET, release BOOT
          # Usage: ./flash_blink.sh /dev/ttyACM0
          PORT=${1:-/dev/ttyACM0}
          echo "Flashing blink firmware to $PORT..."
          esptool.py --chip esp32s2 -p "$PORT" -b 460800 --before no_reset --after hard_reset write_flash \
            0x1000 firmware/blink_bootloader.bin \
            0x8000 firmware/blink_partition_table.bin \
            0x20000 firmware/blink_firmware.bin
          echo "Done! Reset the device to start."
          SCRIPT
          chmod +x flash_blink.sh

          cat > flash_blink.bat << 'SCRIPT'
          @echo off
          rem Enter download mode first: hold BOOT, tap RESET, release BOOT
          set PORT=%1
          if "%PORT%"=="" set PORT=COM3
          echo Flashing blink firmware to %PORT%...
          esptool.py --chip esp32s2 -p %PORT% -b 460800 --before no_reset --after hard_reset write_flash 0x1000 firmware\blink_bootloader.bin 0x8000 firmware\blink_partition_table.bin 0x20000 firmware\blink_firmware.bin
          echo Done! Reset the device to start.
          SCRIPT

      - name: Generate Checksums
        run: |
          cd firmware
          sha256sum *.bin > ../checksums.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="firmware/blink_bootloader.bin \
            firmware/blink_partition_table.bin \
            firmware/blink_firmware.bin \
            flash_blink.sh \
            flash_blink.bat \
            checksums.txt"
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            gh release upload ${{ github.ref_name }} $ASSETS --clobber
          else
            gh release create ${{ github.ref_name }} \
              $ASSETS \
              --title "ESP32-S2-Mini Firmware ${{ github.ref_name }}" \
              --notes-file <(echo "OTA dual-slot: app @ 0x20000, bootloader @ 0x1000, partition table @ 0x8000 (ESP32-S2). First flash needs bootloader + partition table + app (the scripts do all three). Enter download mode before flashing: hold BOOT, tap RESET, release BOOT.")
          fi
